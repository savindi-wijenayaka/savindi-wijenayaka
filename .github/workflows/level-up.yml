name: Level Up

on:
  schedule:
    # 1 Sept and 1 Mar (every 6 months)
    - cron: '0 0 1 3,9 *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Add or remove time'
        required: true
        default: 'add'
        type: choice
        options:
          - add
          - remove
      amount:
        description: 'Years to add/remove'
        required: true
        default: '0.5'
        type: choice
        options:
          - '0.5'
          - '1'
      category:
        description: 'XP category'
        required: true
        default: 'industry'
        type: choice
        options:
          - industry
          - academia

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply change
        env:
          ACTION: ${{ github.event_name == 'schedule' && 'add' || inputs.action }}
          AMOUNT: ${{ github.event_name == 'schedule' && '0.5' || inputs.amount }}
          CATEGORY: ${{ github.event_name == 'schedule' && 'industry' || inputs.category }}
        run: |
          python3 .github/scripts/level_up.py \
            --action "$ACTION" --amount "$AMOUNT" --category "$CATEGORY"

      - name: Commit and push
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/header.svg assets/header-dark.svg .github/career.json
          LEVEL=$(python3 -c "import json; print(json.load(open('.github/career.json'))['total'])")
          git diff --staged --quiet || git commit -m "chore: career update, total ${LEVEL}y [skip ci]"
          git push
